<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Four Cut</title>
<style>
  :root{
    --bg: #efeeec;
    --card: #ffffff;
    --line: #cfcfcb;
    --ink: #1c1c1a;
    --ink-soft: #7a7a76;
    --cell-empty: #d8d8d4;
    --dot: #b7b7b2;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{
    margin:0; padding:0;
    background: var(--bg);
    font-family: "Noto Sans TC","PingFang TC","Hiragino Sans GB",sans-serif;
    color: var(--ink);
    overscroll-behavior: none;
    width:100%;
    overflow-x:hidden;
  }
  .app{
    max-width: 460px;
    margin: 0 auto;
    min-height: 100dvh;
    display:flex;
    flex-direction:column;
    padding: calc(env(safe-area-inset-top) + 8px) 16px calc(env(safe-area-inset-bottom) + 14px);
  }
  header{
    text-align:center;
    margin-bottom: 6px;
    flex-shrink:0;
  }
  header h1{
    font-family: Georgia, "Times New Roman", serif;
    font-size: 15px;
    letter-spacing: 2px;
    margin: 0 0 2px;
    font-weight: 700;
  }
  header p{
    margin:0;
    font-family: Georgia, "Times New Roman", serif;
    font-size: 9px;
    color: var(--ink-soft);
    letter-spacing: 1px;
  }

  /* ---- Photo strip (frame) ---- */
  .frame-outer{
    width:100%;
    max-width: 250px;
    margin: 0 auto;
    flex-shrink: 1;
    min-height: 0;
  }
  .frame-wrap{
    position:relative;
    background: #7fb6e8;
    border-radius: 0;
    box-shadow: 0 8px 22px rgba(0,0,0,0.15);
    aspect-ratio: 603 / 1795;
    width:100%;
    overflow:hidden;
  }
  .frame-wrap > img.template-bg{
    position:absolute; inset:0;
    width:100%; height:100%;
    display:block;
    pointer-events:none;
    z-index:0;
  }
  .cell{
    position:absolute;
    left: 6.63%;
    width: 86.57%;
    background: var(--cell-empty);
    border-radius: 0;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:1;
  }
  .cell.c0{ top: 9.75%; height: 21.73%; }
  .cell.c1{ top: 33.82%; height: 21.73%; }
  .cell.c2{ top: 57.88%; height: 21.67%; }
  .cell video{
    width:100%; height:100%;
    object-fit: cover;
    display:block;
    filter: grayscale(8%) contrast(84%) brightness(114%) saturate(80%);
  }
  .cell img{
    width:100%; height:100%;
    object-fit: cover;
    display:block;
    /* 濾鏡已在拍照時烤進圖片本身，這裡不再重複套用，避免過曝洗白 */
  }
  .cell .haze{
    position:absolute; inset:0;
    background: radial-gradient(ellipse at center, rgba(236,240,248,0) 40%, rgba(236,240,248,0.34) 100%),
                linear-gradient(rgba(232,236,246,0.14), rgba(232,236,246,0.14));
    pointer-events:none;
  }
  .cell.mirror video{ transform: scaleX(-1); }
  .cell.active{
    outline: 1.5px solid #fff;
    outline-offset: -1.5px;
  }
  .cell .placeholder{
    font-size: 11px;
    color: var(--ink-soft);
    letter-spacing: 1px;
  }
  .countdown-num{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    background: rgba(0,0,0,0.28);
    color:#fff;
    font-size: 44px;
    font-weight:700;
    z-index: 5;
    pointer-events:none;
  }

  /* ---- Controls ---- */
  .controls{
    margin-top: 10px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap: 8px;
    flex-shrink:0;
  }
  .status{
    font-size: 12px;
    color: var(--ink-soft);
    text-align:center;
    min-height: 15px;
  }
  .option-row{
    display:flex;
    align-items:center;
    justify-content:center;
    gap: 6px;
    flex-wrap: wrap;
  }
  .option-row .label{
    font-size: 11px;
    color: var(--ink-soft);
    margin-right: 2px;
  }
  .opt-btn{
    padding: 6px 12px;
    border-radius: 20px;
    border: 1px solid var(--line);
    background: #fff;
    color: var(--ink-soft);
    font-size: 12px;
    cursor:pointer;
  }
  .opt-btn.active{
    background: var(--ink);
    border-color: var(--ink);
    color: #fff;
  }
  .btn-row{
    display:flex; align-items:center; justify-content:center; gap: 22px;
    margin-top: 4px;
  }
  .shutter{
    width: 62px; height: 62px;
    border-radius: 50%;
    background: #fff;
    border: 4px solid var(--ink);
    box-shadow: 0 4px 14px rgba(0,0,0,0.15);
    cursor:pointer;
  }
  .shutter:active{ transform: scale(0.94); }
  .icon-btn{
    width: 42px; height:42px;
    border-radius: 50%;
    border: 1px solid var(--line);
    background: #fff;
    display:flex; align-items:center; justify-content:center;
    font-size: 16px;
    cursor:pointer;
    color: var(--ink);
    flex-shrink:0;
  }
  .icon-btn:active{ transform: scale(0.94); }
  .countdown-btn{
    font-size: 11px;
    font-weight: 700;
    color: var(--ink-soft);
    letter-spacing: 0.3px;
  }
  .countdown-btn.on{
    background: var(--ink);
    border-color: var(--ink);
    color: #fff;
  }
  .preview-actions{
    display:flex; gap: 12px;
  }
  .pill-btn{
    padding: 10px 20px;
    border-radius: 2px;
    border: 1px solid var(--ink);
    font-size: 13px;
    font-weight: 600;
    cursor:pointer;
    letter-spacing: 1px;
    background: #fff;
    color: var(--ink);
  }
  .pill-btn.confirm{
    background: var(--ink);
    color: #fff;
  }
  .pill-btn.restart{ margin-top: 4px; }

  .note{
    font-size: 11px;
    color: var(--ink-soft);
    text-align:center;
  }

  /* ---- Result ---- */
  .result-wrap{
    display:none;
    flex-direction:column;
    align-items:center;
    gap: 12px;
    margin-top: 4px;
  }
  .sticker-stage{
    position:relative;
    width: 100%;
    max-width: 340px;
    touch-action: none;
  }
  .sticker-stage img#resultImg{
    width: 100%;
    display:block;
    border-radius: 0;
    box-shadow: 0 8px 24px rgba(0,0,0,0.12);
  }
  .sticker-layer{
    position:absolute;
    inset:0;
  }
  .sticker-item{
    position:absolute;
    width: 20%;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  .sticker-item img{
    width:100%;
    display:block;
    pointer-events:none;
    -webkit-user-drag:none;
  }
  .sticker-item.selected{
    outline: 1.5px dashed rgba(0,0,0,0.55);
    outline-offset: 4px;
  }
  .sticker-item .del-btn{
    position:absolute;
    top:-11px; right:-11px;
    width:22px; height:22px;
    border-radius:50%;
    background:#000;
    color:#fff;
    font-size:13px;
    line-height:1;
    display:none;
    align-items:center;
    justify-content:center;
    cursor:pointer;
  }
  .sticker-item.selected .del-btn{ display:flex; }
  .sticker-tray{
    display:flex;
    gap: 8px;
    overflow-x:auto;
    width:100%;
    max-width: 340px;
    padding: 2px 2px 6px;
    -webkit-overflow-scrolling: touch;
  }
  .sticker-tray img{
    width:50px; height:50px;
    object-fit:contain;
    border:1px solid var(--line);
    border-radius:8px;
    background:#fff;
    padding:5px;
    flex-shrink:0;
    cursor:pointer;
  }
  .sticker-tray img:active{ transform:scale(0.94); }
  .hint{
    font-size: 12px;
    color: var(--ink-soft);
    text-align:center;
    line-height:1.6;
  }
  a.download-btn{
    display:inline-block;
    background: var(--ink);
    color:#fff;
    text-decoration:none;
    padding: 12px 26px;
    border-radius: 2px;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 1px;
  }
  .error-box{
    background:#f4f4f2; color:#5a5a56; border:1px solid #cfcfcb;
    padding: 12px 14px; border-radius: 4px; font-size: 12.5px; line-height:1.6;
    display:none;
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>FOUR CUT</h1>
    <p>PHOTO BOOTH</p>
  </header>

  <div id="errorBox" class="error-box"></div>

  <div class="frame-outer">
    <div class="frame-wrap" id="frameWrap">
      <img class="template-bg" src="shushin-bg.png" alt="">
      <div class="cell c0" data-idx="0"><span class="placeholder">1</span></div>
      <div class="cell c1" data-idx="1"><span class="placeholder">2</span></div>
      <div class="cell c2" data-idx="2"><span class="placeholder">3</span></div>
    </div>
  </div>

  <div class="controls" id="controls">
    <div class="status" id="statusText"></div>

    <div class="option-row" id="zoomRow" style="display:none;">
      <button class="opt-btn active" data-zoom="1x">1x</button>
      <button class="opt-btn" data-zoom="0.5x">0.5x</button>
    </div>
    <div class="note" id="zoomNote"></div>

    <div class="btn-row" id="liveButtons">
      <button class="icon-btn" id="flipBtn" title="Flip camera">⟲</button>
      <button class="shutter" id="shutterBtn" title="Shutter"></button>
      <button class="icon-btn countdown-btn" id="countdownBtn" title="Timer">OFF</button>
    </div>
    <div class="preview-actions" id="previewButtons" style="display:none;">
      <button class="pill-btn retake" id="retakeBtn">Retake</button>
      <button class="pill-btn confirm" id="confirmBtn">Next</button>
    </div>
  </div>

  <div class="result-wrap" id="resultWrap">
    <div class="sticker-stage" id="stickerStage">
      <img id="resultImg" alt="Four Cut result">
      <div class="sticker-layer" id="stickerLayer"></div>
    </div>
    <div class="sticker-tray" id="stickerTray"></div>
    <div class="hint">Add stickers if you like, then tap Download to save.<br>(Long-press only saves the plain photo.)</div>
    <a class="download-btn" id="downloadBtn" download="four-cut-photo.png">Download</a>
    <button class="pill-btn restart" id="restartBtn">Start Over</button>
  </div>
</div>

<script>
(function(){
  const cells = Array.from(document.querySelectorAll('.cell'));
  const shutterBtn = document.getElementById('shutterBtn');
  const flipBtn = document.getElementById('flipBtn');
  const retakeBtn = document.getElementById('retakeBtn');
  const confirmBtn = document.getElementById('confirmBtn');
  const statusText = document.getElementById('statusText');
  const liveButtons = document.getElementById('liveButtons');
  const previewButtons = document.getElementById('previewButtons');
  const frameWrap = document.getElementById('frameWrap');
  const frameOuter = document.querySelector('.frame-outer');
  const controls = document.getElementById('controls');
  const resultWrap = document.getElementById('resultWrap');
  const resultImg = document.getElementById('resultImg');
  const downloadBtn = document.getElementById('downloadBtn');
  const restartBtn = document.getElementById('restartBtn');
  const stickerStage = document.getElementById('stickerStage');
  const stickerLayer = document.getElementById('stickerLayer');
  const stickerTray = document.getElementById('stickerTray');

  const STICKER_SOURCES = [
    'stickers/flower-01.png','stickers/flower-02.png','stickers/flower-03.png',
    'stickers/flower-04.png','stickers/flower-05.png','stickers/flower-06.png',
    'stickers/flower-07.png','stickers/flower-08.png','stickers/flower-09.png',
    'stickers/flower-10.png','stickers/flower-11.png','stickers/flower-12.png'
  ];
  const stickerImgCache = {};
  STICKER_SOURCES.forEach(src=>{
    const im = new Image();
    im.src = src;
    stickerImgCache[src] = im;
  });
  let stickers = [];
  let stickerSeq = 0;
  let activeStickerId = null;
  let baseCanvas = null;
  let trayBuilt = false;
  const errorBox = document.getElementById('errorBox');
  const countdownBtn = document.getElementById('countdownBtn');
  const zoomBtns = Array.from(document.querySelectorAll('[data-zoom]'));
  const zoomRow = document.getElementById('zoomRow');
  const zoomNote = document.getElementById('zoomNote');

  const countdownOptions = [0, 3, 5, 10];
  let countdownIdx = 0;

  const posNames = ['top','middle','bottom'];
  let currentIndex = 0;
  let captured = [null,null,null];
  let pendingDataUrl = null;
  let stream = null;
  let facingMode = 'user';
  let zoomMode = '1x';
  let videoEl = null;
  let backDevices = null;
  let countdownSeconds = 0;
  let countdownActive = false;
  let countdownTimer = null;

  function showError(msg){
    errorBox.style.display = 'block';
    errorBox.textContent = msg;
  }
  function clearError(){ errorBox.style.display = 'none'; }
  function showZoomNote(msg){
    zoomNote.textContent = msg;
    if(msg){ setTimeout(()=>{ if(zoomNote.textContent===msg) zoomNote.textContent=''; }, 3200); }
  }

  countdownBtn.addEventListener('click', ()=>{
    countdownIdx = (countdownIdx + 1) % countdownOptions.length;
    countdownSeconds = countdownOptions[countdownIdx];
    countdownBtn.textContent = countdownSeconds === 0 ? 'OFF' : countdownSeconds + 's';
    countdownBtn.classList.toggle('on', countdownSeconds !== 0);
  });

  zoomBtns.forEach(btn=>{
    btn.addEventListener('click', ()=>{
      if(btn.classList.contains('active')) return;
      zoomBtns.forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      zoomMode = btn.dataset.zoom;
      startCamera();
    });
  });

  async function ensureBackDevices(){
    try{
      const list = await navigator.mediaDevices.enumerateDevices();
      backDevices = list.filter(d => d.kind === 'videoinput' && /back/i.test(d.label));
    }catch(e){ backDevices = []; }
    return backDevices;
  }

  async function buildConstraints(){
    if(facingMode === 'user'){
      return { facingMode: 'user', width:{ideal:1080}, height:{ideal:1440} };
    }
    const devs = await ensureBackDevices();
    if(zoomMode === '0.5x'){
      const wide = devs.find(d => /ultra ?wide/i.test(d.label));
      if(wide){
        return { deviceId: { exact: wide.deviceId }, width:{ideal:1080}, height:{ideal:1440} };
      }
      zoomMode = '1x';
      zoomBtns.forEach(b=>b.classList.toggle('active', b.dataset.zoom === '1x'));
      showZoomNote('0.5x lens not found on this device. Switched back to 1x.');
    }
    const normal = devs.find(d => /^back camera$/i.test(d.label.trim()))
                 || devs.find(d => /back/i.test(d.label) && !/ultra|tele/i.test(d.label));
    if(normal){
      return { deviceId: { exact: normal.deviceId }, width:{ideal:1080}, height:{ideal:1440} };
    }
    return { facingMode: { exact: 'environment' }, width:{ideal:1080}, height:{ideal:1440} };
  }

  async function startCamera(){
    clearError();
    stopCamera();
    zoomRow.style.display = facingMode === 'environment' ? 'flex' : 'none';

    const cell = cells[currentIndex];
    cell.classList.toggle('mirror', facingMode === 'user');
    cell.innerHTML = '';
    videoEl = document.createElement('video');
    videoEl.autoplay = true;
    videoEl.playsInline = true;
    videoEl.setAttribute('playsinline','true');
    videoEl.muted = true;
    const haze = document.createElement('div');
    haze.className = 'haze';
    cell.appendChild(videoEl);
    cell.appendChild(haze);
    try{
      const constraints = await buildConstraints();
      stream = await navigator.mediaDevices.getUserMedia({ video: constraints, audio: false });
      videoEl.srcObject = stream;
      if(facingMode === 'environment') ensureBackDevices();
    }catch(err){
      showError('Camera unavailable. Please allow camera access in your browser, and make sure this page is loaded over https or localhost.');
    }
  }

  function stopCamera(){
    if(stream){
      stream.getTracks().forEach(t=>t.stop());
      stream = null;
    }
  }

  function renderCellPlaceholder(idx){
    const cell = cells[idx];
    cell.classList.remove('mirror','active');
    if(captured[idx]){
      cell.innerHTML = `<img src="${captured[idx]}">`;
    } else {
      cell.innerHTML = `<span class="placeholder">${idx+1}</span>`;
    }
  }

  function setActiveCellLive(){
    cells.forEach((c,i)=>{
      c.classList.toggle('active', i === currentIndex);
      if(i !== currentIndex) renderCellPlaceholder(i);
    });
    statusText.textContent = '';
    liveButtons.style.display = 'flex';
    previewButtons.style.display = 'none';
    startCamera();
  }

  function onShutterClick(){
    if(countdownActive){
      cancelCountdown();
      statusText.textContent = '';
      return;
    }
    if(countdownSeconds > 0){
      startCountdown();
    } else {
      capturePhoto();
    }
  }

  function startCountdown(){
    countdownActive = true;
    let remain = countdownSeconds;
    const cell = cells[currentIndex];
    const numEl = document.createElement('div');
    numEl.className = 'countdown-num';
    numEl.textContent = remain;
    cell.appendChild(numEl);
    statusText.textContent = '';
    countdownTimer = setInterval(()=>{
      remain -= 1;
      if(remain <= 0){
        clearInterval(countdownTimer);
        countdownActive = false;
        numEl.remove();
        capturePhoto();
      } else {
        numEl.textContent = remain;
      }
    }, 1000);
  }

  function cancelCountdown(){
    if(countdownTimer) clearInterval(countdownTimer);
    countdownActive = false;
    const numEl = cells[currentIndex].querySelector('.countdown-num');
    if(numEl) numEl.remove();
  }

  let captureBusy = false;

  async function capturePhoto(){
    if(!videoEl || videoEl.readyState < 2) return;
    if(captureBusy) return;
    captureBusy = true;
    const cell = cells[currentIndex];
    const rect = cell.getBoundingClientRect();
    const targetW = 720, targetH = 720 * (rect.height/rect.width);
    const canvas = document.createElement('canvas');
    canvas.width = targetW;
    canvas.height = targetH;
    const ctx = canvas.getContext('2d');

    const vw = videoEl.videoWidth, vh = videoEl.videoHeight;
    const targetRatio = targetW/targetH;
    const srcRatio = vw/vh;
    let sx,sy,sw,sh;
    if(srcRatio > targetRatio){
      sh = vh; sw = vh*targetRatio; sx = (vw-sw)/2; sy = 0;
    } else {
      sw = vw; sh = vw/targetRatio; sx = 0; sy = (vh-sh)/2;
    }
    if(facingMode === 'user'){
      ctx.translate(targetW,0);
      ctx.scale(-1,1);
    }
    ctx.filter = 'grayscale(8%) contrast(84%) brightness(114%) saturate(80%)';
    ctx.drawImage(videoEl, sx, sy, sw, sh, 0, 0, targetW, targetH);
    ctx.filter = 'none';
    if(facingMode === 'user'){
      ctx.setTransform(1,0,0,1,0,0);
    }

    applyHaze(ctx, targetW, targetH);

    pendingDataUrl = canvas.toDataURL('image/jpeg', 0.92);

    cell.classList.remove('active');
    cell.innerHTML = `<img src="${pendingDataUrl}">`;
    stopCamera();

    statusText.textContent = '';
    liveButtons.style.display = 'none';
    previewButtons.style.display = 'flex';
    captureBusy = false;
  }

  function applyHaze(ctx, w, h){
    // 全畫面淡淡冷白疊層，中和室內燈光偏黃，讓膚色偏向白淨而不是蠟黃
    ctx.fillStyle = 'rgba(232,236,246,0.14)';
    ctx.fillRect(0,0,w,h);

    // 柔焦朦朧感：邊緣泛白但中心維持清晰、保留原本氣色與顏色
    const grad = ctx.createRadialGradient(w/2,h/2, Math.min(w,h)*0.26, w/2,h/2, Math.max(w,h)*0.8);
    grad.addColorStop(0, 'rgba(236,240,248,0)');
    grad.addColorStop(1, 'rgba(236,240,248,0.34)');
    ctx.fillStyle = grad;
    ctx.fillRect(0,0,w,h);
  }

  function retake(){
    pendingDataUrl = null;
    setActiveCellLive();
  }

  function confirmPhoto(){
    captured[currentIndex] = pendingDataUrl;
    pendingDataUrl = null;
    if(currentIndex < cells.length - 1){
      currentIndex += 1;
      setActiveCellLive();
    } else {
      finishAndRender();
    }
  }

  function flipCamera(){
    if(countdownActive) cancelCountdown();
    facingMode = facingMode === 'user' ? 'environment' : 'user';
    zoomMode = '1x';
    zoomBtns.forEach(b=>b.classList.toggle('active', b.dataset.zoom === '1x'));
    startCamera();
  }

  async function finishAndRender(){
    stopCamera();
    controls.style.display = 'none';
    frameOuter.style.display = 'none';
    statusText.textContent = '';

    // 畫布用範本原圖 2 倍解析度輸出（603x1795 -> 1206x3590），確保下載清晰
    const W = 1206, H = 3590;
    const canvas = document.createElement('canvas');
    canvas.width = W; canvas.height = H;
    const ctx = canvas.getContext('2d');

    const [bgImg, imgs] = await Promise.all([
      loadImageForComposite('shushin-bg.png'),
      Promise.all(captured.map(loadImageForComposite))
    ]);

    if(bgImg){
      ctx.drawImage(bgImg, 0, 0, W, H);
    }

    // 三個灰色方框的精準座標（從原圖 603x1795 量測後 x2 換算）
    const boxX = 80, boxW = 1044;
    const boxes = [
      { y: 350,  h: 780 },
      { y: 1214, h: 780 },
      { y: 2078, h: 778 }
    ];
    boxes.forEach((b,i)=> drawPhotoInCell(ctx, imgs[i], boxX, b.y, boxW, b.h));

    baseCanvas = canvas;
    const dataUrl = canvas.toDataURL('image/png');
    resultImg.src = dataUrl;
    downloadBtn.href = dataUrl;
    resultWrap.style.display = 'flex';
    renderStickerTray();
  }

  function loadImageForComposite(dataUrl){
    return new Promise(resolve=>{
      if(!dataUrl){ resolve(null); return; }
      const img = new Image();
      img.onload = ()=> resolve(img);
      img.onerror = ()=> resolve(null);
      img.src = dataUrl;
    });
  }

  // ---------- Stickers ----------
  function renderStickerTray(){
    if(trayBuilt) return;
    trayBuilt = true;
    STICKER_SOURCES.forEach(src=>{
      const thumb = document.createElement('img');
      thumb.src = src;
      thumb.addEventListener('click', ()=> addSticker(src));
      stickerTray.appendChild(thumb);
    });
  }

  function addSticker(src){
    const state = { id: 'st'+(stickerSeq++), src, x:50, y:50, scale:1, rot:0 };
    stickers.push(state);
    buildStickerEl(state);
    selectSticker(state.id);
  }

  function buildStickerEl(state){
    const el = document.createElement('div');
    el.className = 'sticker-item';
    const img = document.createElement('img');
    img.src = state.src;
    img.draggable = false;
    const del = document.createElement('div');
    del.className = 'del-btn';
    del.textContent = '✕';
    del.addEventListener('pointerdown', (e)=>{ e.stopPropagation(); });
    del.addEventListener('click', (e)=>{
      e.stopPropagation();
      removeSticker(state.id);
    });
    el.appendChild(img);
    el.appendChild(del);
    stickerLayer.appendChild(el);
    state.el = el;
    applyStickerTransform(state);
    attachStickerGestures(state);
  }

  function applyStickerTransform(state){
    state.el.style.left = state.x + '%';
    state.el.style.top = state.y + '%';
    state.el.style.transform = `translate(-50%,-50%) rotate(${state.rot}deg) scale(${state.scale})`;
  }

  function selectSticker(id){
    activeStickerId = id;
    stickers.forEach(s=>{ if(s.el) s.el.classList.toggle('selected', s.id === id); });
  }

  function removeSticker(id){
    const idx = stickers.findIndex(s=>s.id===id);
    if(idx > -1){
      stickers[idx].el.remove();
      stickers.splice(idx,1);
    }
    if(activeStickerId === id) activeStickerId = null;
  }

  stickerLayer.addEventListener('pointerdown', (e)=>{
    if(e.target === stickerLayer) selectSticker(null);
  });

  function attachStickerGestures(state){
    const el = state.el;
    const pointers = new Map();
    let gesture = null;

    function stageRect(){ return stickerStage.getBoundingClientRect(); }

    el.addEventListener('pointerdown', (e)=>{
      e.preventDefault();
      e.stopPropagation();
      selectSticker(state.id);
      el.setPointerCapture(e.pointerId);
      pointers.set(e.pointerId, { x:e.clientX, y:e.clientY });

      if(pointers.size === 1){
        gesture = {
          type:'drag', startX:state.x, startY:state.y,
          px:e.clientX, py:e.clientY, rect:stageRect()
        };
      } else if(pointers.size === 2){
        const pts = Array.from(pointers.values());
        const dx = pts[1].x-pts[0].x, dy = pts[1].y-pts[0].y;
        gesture = {
          type:'pinch',
          startDist: Math.hypot(dx,dy),
          startAngle: Math.atan2(dy,dx)*180/Math.PI,
          startScale: state.scale, startRot: state.rot,
          startX: state.x, startY: state.y,
          midStart: { x:(pts[0].x+pts[1].x)/2, y:(pts[0].y+pts[1].y)/2 },
          rect: stageRect()
        };
      }
    });

    el.addEventListener('pointermove', (e)=>{
      if(!pointers.has(e.pointerId)) return;
      pointers.set(e.pointerId, { x:e.clientX, y:e.clientY });

      if(pointers.size === 1 && gesture && gesture.type === 'drag'){
        const dxPx = e.clientX - gesture.px;
        const dyPx = e.clientY - gesture.py;
        state.x = gesture.startX + (dxPx/gesture.rect.width)*100;
        state.y = gesture.startY + (dyPx/gesture.rect.height)*100;
        applyStickerTransform(state);
      } else if(pointers.size === 2 && gesture && gesture.type === 'pinch'){
        const pts = Array.from(pointers.values());
        const dx = pts[1].x-pts[0].x, dy = pts[1].y-pts[0].y;
        const dist = Math.hypot(dx,dy);
        const angle = Math.atan2(dy,dx)*180/Math.PI;
        state.scale = Math.min(3, Math.max(0.3, gesture.startScale * (dist/gesture.startDist)));
        state.rot = gesture.startRot + (angle - gesture.startAngle);
        const mid = { x:(pts[0].x+pts[1].x)/2, y:(pts[0].y+pts[1].y)/2 };
        state.x = gesture.startX + ((mid.x-gesture.midStart.x)/gesture.rect.width)*100;
        state.y = gesture.startY + ((mid.y-gesture.midStart.y)/gesture.rect.height)*100;
        applyStickerTransform(state);
      }
    });

    function endPointer(e){
      if(!pointers.has(e.pointerId)) return;
      pointers.delete(e.pointerId);
      if(pointers.size === 1){
        const remaining = Array.from(pointers.values())[0];
        gesture = {
          type:'drag', startX:state.x, startY:state.y,
          px:remaining.x, py:remaining.y, rect: stageRect()
        };
      } else {
        gesture = null;
      }
    }
    el.addEventListener('pointerup', endPointer);
    el.addEventListener('pointercancel', endPointer);
  }

  function flattenWithStickers(){
    if(!baseCanvas) return null;
    const finalCanvas = document.createElement('canvas');
    finalCanvas.width = baseCanvas.width;
    finalCanvas.height = baseCanvas.height;
    const ctx = finalCanvas.getContext('2d');
    ctx.drawImage(baseCanvas, 0, 0);

    stickers.forEach(st=>{
      const img = stickerImgCache[st.src];
      if(!img || !img.complete || img.naturalWidth === 0) return;
      const W = finalCanvas.width;
      const drawW = 0.20 * W * st.scale;
      const ratio = img.naturalHeight / img.naturalWidth;
      const drawH = drawW * ratio;
      const cx = (st.x/100) * finalCanvas.width;
      const cy = (st.y/100) * finalCanvas.height;
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(st.rot * Math.PI/180);
      ctx.drawImage(img, -drawW/2, -drawH/2, drawW, drawH);
      ctx.restore();
    });

    return finalCanvas.toDataURL('image/png');
  }

  downloadBtn.addEventListener('click', (e)=>{
    if(stickers.length === 0) return; // href already points to the base composite
    e.preventDefault();
    const finalUrl = flattenWithStickers();
    if(!finalUrl) return;
    resultImg.src = finalUrl;
    downloadBtn.href = finalUrl;
    stickerLayer.innerHTML = '';
    stickers = [];
    activeStickerId = null;
    downloadBtn.click();
  });
  // ---------- End stickers ----------

  function roundRectPath(ctx,x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }

  function drawPhotoInCell(ctx, img, x, y, w, h){
    ctx.save();
    ctx.beginPath();
    ctx.rect(x, y, w, h);
    ctx.clip();
    if(img){
      const srcRatio = img.width/img.height;
      const targetRatio = w/h;
      let sx,sy,sw,sh;
      if(srcRatio > targetRatio){
        sh = img.height; sw = img.height*targetRatio; sx=(img.width-sw)/2; sy=0;
      } else {
        sw = img.width; sh = img.width/targetRatio; sx=0; sy=(img.height-sh)/2;
      }
      ctx.drawImage(img, sx, sy, sw, sh, x, y, w, h);
    } else {
      ctx.fillStyle = '#d8d8d4';
      ctx.fillRect(x,y,w,h);
    }
    ctx.restore();
  }

  function restartAll(){
    captured = [null,null,null];
    pendingDataUrl = null;
    currentIndex = 0;
    stickerLayer.innerHTML = '';
    stickers = [];
    activeStickerId = null;
    baseCanvas = null;
    resultWrap.style.display = 'none';
    frameOuter.style.display = 'block';
    controls.style.display = 'flex';
    cells.forEach((c,i)=>renderCellPlaceholder(i));
    setActiveCellLive();
  }

  shutterBtn.addEventListener('click', onShutterClick);
  flipBtn.addEventListener('click', flipCamera);
  retakeBtn.addEventListener('click', retake);
  confirmBtn.addEventListener('click', confirmPhoto);
  restartBtn.addEventListener('click', restartAll);

  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    showError('This browser does not support camera access. Please open this page in Safari (iOS) or Chrome (Android).');
  }

  setActiveCellLive();
})();
</script>
